{{- include "rr.validate" . -}}
{{- $root := . -}}
{{- range $rr := .Values.routers }}
{{- $name := printf "%s-%s" $root.Release.Name $rr.name -}}
{{- $cfg := include "rr.config" (dict "rr" $rr "v" $root.Values) -}}
{{- $attachments := list -}}
{{- range $link := $rr.links -}}
{{- $attachments = append $attachments (dict "name" (printf "%s-%s" $name $link.interface) "namespace" $root.Release.Namespace "interface" $link.interface) -}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  frr.conf: |
{{ $cfg | indent 4 }}
  loopback: {{ $rr.loopback | quote }}
  links: |
{{- range $if := list "net1" "net2" "net3" "net4" }}
{{- range $rr.links }}{{ if eq .interface $if }}
    {{ .interface }} {{ .localAddress }}
{{- end }}{{ end }}{{ end }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}
  annotations:
    k8s.v1.cni.cncf.io/networks: {{ $attachments | toJson | quote }}
    rr.example.org/boot-sha256: {{ printf "%s%s%s" $cfg (toJson $rr) $root.Values.image | sha256sum | quote }}
    rr.example.org/security-profile: lab-sysadmin
spec:
  nodeSelector:
{{ toYaml $rr.nodeSelector | indent 4 }}
  hostNetwork: false
  hostPID: false
  hostIPC: false
  automountServiceAccountToken: false
  restartPolicy: Always
  terminationGracePeriodSeconds: 20
  securityContext:
    runAsUser: 0
    runAsGroup: 101
    fsGroup: 101
    supplementalGroups: [102]
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: frr
      image: {{ $root.Values.image | quote }}
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
          add: [CHOWN, SETUID, SETGID, NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SYS_ADMIN]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "1", memory: 256Mi}
      startupProbe:
        exec: {command: [/usr/local/bin/health.sh]}
        periodSeconds: 2
        failureThreshold: 30
      readinessProbe:
        exec: {command: [/usr/local/bin/health.sh]}
        periodSeconds: 5
      livenessProbe:
        exec: {command: [/usr/local/bin/health.sh]}
      # FRR's package uses /lib/frr for mgmtd history/state.
        periodSeconds: 10
        failureThreshold: 3
      volumeMounts:
        - {name: desired, mountPath: /config, readOnly: true}
        - {name: config, mountPath: /etc/frr}
        - {name: run, mountPath: /run/frr}
        - {name: diagnostic, mountPath: /var/tmp/frr}
        - {name: state, mountPath: /lib/frr}
  volumes:
    - name: desired
      configMap: {name: {{ $name }}}
    - name: config
      emptyDir: {}
    - name: run
      emptyDir: {}
    - name: diagnostic
      emptyDir: {}
    - name: state
      emptyDir: {}
{{- range $link := $rr.links }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $name }}-{{ $link.interface }}
spec:
  config: {{ dict "cniVersion" "0.3.1" "name" (printf "%s-%s" $name $link.interface) "type" "vlan" "master" $rr.vlanMaster "vlanId" $link.vlanId "ipam" (dict "type" "static" "addresses" (list (dict "address" $link.localAddress))) | toJson | quote }}
{{- end }}
{{- end }}
